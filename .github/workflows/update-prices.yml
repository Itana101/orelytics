
name: Update live commodity prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check API secret
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: |
          if [ -z "$OILPRICEAPI_KEY" ]; then
            echo "Missing OILPRICEAPI_KEY repository secret"
            exit 1
          fi
          echo "API secret is configured."

      - name: Confirm workflow is working
        run: echo "Workflow started successfully."
