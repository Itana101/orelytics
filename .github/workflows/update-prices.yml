
name: Update live commodity prices

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch gold, copper and iron ore
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          key = os.environ.get("OILPRICEAPI_KEY")
          if not key:
              raise SystemExit("Missing OILPRICEAPI_KEY secret")

          codes = "GOLD_USD,COPPER_USD,IRON_ORE_USD"
          query = urllib.parse.urlencode({"by_code": codes})
          url = "https://api.oilpriceapi.com/v1/prices/latest?" + query

          req = urllib.request.Request(
              url,
              headers={"Authorization": "Token " + key,
                       "Accept": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          if payload.get("status") != "success":
              raise SystemExit("API did not return success: " +
                               json.dumps(payload))

          data = payload.get("data", {})
          rows = data.get("prices", []) if isinstance(data, dict) else []

          aliases = {
              "GOLD_USD": "gold",
              "COPPER_USD": "copper",
              "IRON_ORE_USD": "iron_ore"
          }

          prices = {}
          for row in rows:
              code = row.get("code")
              if code not in aliases:
                  continue
              prices[aliases[code]] = {
                  "code": code,
                  "price": row.get("price"),
                  "currency": row.get("currency", "USD"),
                  "unit": row.get("unit", "unknown"),
                  "source": row.get("source", "OilPriceAPI"),
                  "source_as_of": row.get("observed_at") or row.get("created_at"),
                  "stale": row.get("stale", False),
                  "data_status": row.get("data_status", "unknown")
              }

          missing = set(aliases.values()) - set(prices)
          if missing:
              raise SystemExit("Missing quotes: " + ", ".join(sorted(missing)))

          output = {
              "provider": "OilPriceAPI",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "prices": prices
          }

          os.makedirs("data", exist_ok=True)
          with open("data/latest-prices.json", "w") as f:
              json.dump(output, f, indent=2)

          print("Successfully saved all three commodity quotes.")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-prices.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update live commodity prices"
            git push
          fi
