name: Update Orelytics Prices

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch metal prices
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          async function main() {
            const codes = [
              "GOLD_USD",
              "COPPER_USD",
              "IRON_ORE_USD"
            ];

            if (!process.env.OILPRICEAPI_KEY) {
              throw new Error("Missing GitHub secret: OILPRICEAPI_KEY");
            }

            const url = new URL(
              "https://api.oilpriceapi.com/v1/prices/latest"
            );
            url.searchParams.set("by_code", codes.join(","));

            const response = await fetch(url, {
              headers: {
                Authorization: `Token ${process.env.OILPRICEAPI_KEY}`,
                Accept: "application/json"
              }
            });

            const body = await response.json();

            if (!response.ok || body.status !== "success") {
              throw new Error(
                `OilPriceAPI error (${response.status}): ${JSON.stringify(body)}`
              );
            }

            const root = body.data || {};
            const records = Array.isArray(root.prices)
              ? root.prices
              : Array.isArray(root)
                ? root
                : [root];

            const aliases = {
              GOLD_USD: "gold",
              COPPER_USD: "copper",
              IRON_ORE_USD: "iron_ore"
            };

            const prices = {};

            for (const record of records) {
              const code = record.code || record.commodity_code;
              const key = aliases[code];

              if (!key) continue;

              const price = Number(record.price);

              if (!Number.isFinite(price)) {
                throw new Error(`Invalid price for ${code}`);
              }

              prices[key] = {
                code,
                price,
                formatted: record.formatted || null,
                currency: record.currency || "USD",
                unit: record.unit || null,
                source: record.source || null,
                source_as_of:
                  record.observed_at ||
                  record.as_of ||
                  record.updated_at ||
                  record.created_at ||
                  null,
                stale: record.stale ?? null,
                data_status: record.data_status || null,
                synthetic: record.synthetic ?? null
              };
            }

            const missing = Object.keys(aliases).filter(
              code => !prices[aliases[code]]
            );

            if (missing.length) {
              throw new Error(
                `API did not return all requested metals. Missing: ${missing.join(", ")}. ` +
                `Returned codes: ${records.map(r => r.code || r.commodity_code || "unknown").join(", ")}`
              );
            }

            const output = {
              provider: "OilPriceAPI",
              updated_at: new Date().toISOString(),
              prices
            };

            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync(
              "data/latest-prices.json",
              JSON.stringify(output, null, 2) + "\n"
            );

            console.log(JSON.stringify(output, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-prices.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Update live metal prices"
            git push
          fi
